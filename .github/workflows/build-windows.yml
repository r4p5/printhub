name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build customer + dashboard web app
        run: npm run build -w @printhub/web

      - name: Prepare desktop resources
        run: |
          npm run icons -w @printhub/desktop
          npm run sumatra -w @printhub/desktop
          npm run bundle -w @printhub/desktop

      - name: Package installer
        working-directory: packages/desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PrintHub-Setup
          path: packages/desktop/release/*.exe
          if-no-files-found: error

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/release/*.exe
